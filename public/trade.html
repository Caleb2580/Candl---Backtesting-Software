        /* Position toolbar statically within its container */
        #chart-toolbar {
            /* position: absolute; */ /* REMOVE */

            /* left: 10px; */
            z-index: 10;

            /* flex-direction: column; */ /* Keep vertical for now, adjust if needed */
            padding: 0.5rem; /* p-2 */
            margin-bottom: 0.5rem; /* Add some spacing below */
        }
        #chart-toolbar button {
            background: none;
            border: 1px solid transparent;
            padding: 0.25rem; /* p-1 */
            margin-right: 0.25rem; /* Add horizontal spacing mr-1 */
            /* margin-bottom: 3px; Remove vertical spacing */
            cursor: pointer;
            width: 32px; /* Slightly larger */
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d1d5db; /* text-gray-300 */
        }
         #chart-toolbar button:last-child {
             margin-right: 0; /* Remove margin from last button */
             /* margin-bottom: 0; */
         }
        #chart-toolbar button svg {
            width: 20px;
            height: 20px;
            fill: currentColor; /* Use button text color */
        }
        #chart-toolbar button:hover {
            background: rgba(75, 85, 99, 0.8); /* bg-gray-600 */
            border-color: #9ca3af; /* border-gray-400 */
            color: #f3f4f6; /* text-gray-100 */
        }
        #chart-toolbar button.active {
            background: rgba(107, 114, 128, 1.0); /* bg-gray-500 */
            border-color: #9ca3af; /* border-gray-400 */
            color: #ffffff; /* text-white */
        }
        /* --- End Toolbar Adjustments --- */

         /* Context Menu - Keep absolute positioning */
         #context-menu {
            position: absolute;
            display: none;
            background-color: #4a5568; /* bg-gray-600 */
            border: 1px solid #9ca3af; /* border-gray-400 */
            padding: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            border-radius: 0.25rem; /* rounded-sm */
         }
         #delete-object {
             display: block;
             width: 100%;
             text-align: left;
             border: none;
             background: none;
             padding: 3px 8px;
             cursor: pointer;
             color: #e5e7eb; /* text-gray-200 */
             font-size: 0.875rem; /* text-sm */
         }
         #delete-object:hover {
            background-color: #6b7280; /* bg-gray-500 */
            color: #ffffff; /* text-white */
         }

         /* Style for active tab */
         .tab-button.active {
             background-color: #4a5568; /* bg-gray-600 */
             font-weight: bold;
         }
         /* Hide inactive tab content */
         .tab-content { display: none; }
         .tab-content.active { display: block; }

        let recentlyUsedTickers = [];

        let currentTicker = null;

        let currentPositions = [];

        // Easing function (ease-out cubic)
        const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

        // Function to calculate 'nice' intervals for grid lines
        const calculateNiceStep = (range, targetSteps) => {
            if (range <= 0 || !isFinite(range) || !isFinite(targetSteps) || targetSteps <= 0) return 1;
            const roughStep = range / targetSteps;
            if (roughStep <= 0 || !isFinite(roughStep)) return 1;
            const exponent = Math.floor(Math.log10(roughStep));
            const magnitude = Math.pow(10, exponent);
            const mantissa = roughStep / magnitude;

            let niceMantissa;
            if (mantissa < 1.5) {
                niceMantissa = 1;
            } else if (mantissa < 3.5) {
                niceMantissa = 2;
            } else if (mantissa < 7.5) {
                niceMantissa = 5;
            } else {
                niceMantissa = 10;
            }
            const niceStepValue = niceMantissa * magnitude;
            return niceStepValue > 0 ? niceStepValue : 1; // Ensure step is positive
        };





        // --- Angle Snapping Logic ---
        const snapAngles = [0, 30, 45, 60, 90, 120, 135, 150, 180]; // Degrees
        const snapAngleRadians = snapAngles.map(a => a * Math.PI / 180);

        const snapToEndPoint = (startPixel, currentPixel, shiftKeyPressed) => {
            // Get current mouse coords in data space first
            const mouseCoords = pixelToCoords(currentPixel.x, currentPixel.y);

            if (!shiftKeyPressed || selectedTool !== 'trendline') {
                return mouseCoords; // No snapping
            }

            const dx = currentPixel.x - startPixel.x;
            const dy = currentPixel.y - startPixel.y;
            // Prevent snapping if points are too close
            if (Math.abs(dx) < 5 && Math.abs(dy) < 5) {
                 return mouseCoords;
            }

            const currentAngle = Math.atan2(dy, dx);
            const distance = Math.sqrt(dx * dx + dy * dy);

            let closestAngle = currentAngle;
            let minAngleDiff = Math.PI; // Max possible difference

            // Check positive and negative angles relative to horizontal
            const referenceAngles = [...snapAngleRadians, ...snapAngleRadians.map(a => a - Math.PI)];

            referenceAngles.forEach(snapRad => {
                // Normalize angle difference to be between -PI and PI
                let angleDiff = snapRad - currentAngle;
                while (angleDiff <= -Math.PI) angleDiff += 2 * Math.PI;
                while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;

                if (Math.abs(angleDiff) < minAngleDiff) {
                    minAngleDiff = Math.abs(angleDiff);
                    closestAngle = snapRad;
                }
            });

            // Calculate the new end point in pixel space based on the snapped angle and original distance
            let snappedX = startPixel.x + distance * Math.cos(closestAngle);
            let snappedY = startPixel.y + distance * Math.sin(closestAngle);

            // --- Add Fix for 90-degree snapping ---
            // Check if the angle is very close to vertical (+/- 90 degrees)
            const ninetyDegreesRad = Math.PI / 2;
            const epsilon = 1e-6; // Small tolerance for floating point comparison
            if (Math.abs(closestAngle - ninetyDegreesRad) < epsilon || Math.abs(closestAngle + ninetyDegreesRad) < epsilon) {
                snappedX = startPixel.x; // Force perfectly vertical alignment
            }
            // --- End Fix ---

            // Convert snapped pixel coords back to data coords
            return pixelToCoords(snappedX, snappedY);
        };

            const easedProgress = easeOutCubic(progress);

            currentMaxPrice = startMaxPrice + (targetMaxPrice - startMaxPrice) * easedProgress;
            currentPriceRange = Math.max(0.0001, currentMaxPrice - currentMinPrice); // Prevent zero range

            // drawChart();

            if (progress < 1) {
                animationFrameId = requestAnimationFrame(animationLoop);
            } else {
                currentMinPrice = targetMinPrice;
                currentMaxPrice = targetMaxPrice;
                currentPriceRange = Math.max(0.0001, currentMaxPrice - currentMinPrice);

            if (fullHistoricalData.length - displayedData.length > 300 && displayedData.length >= 60 && new Date(displayedData[currentTimeIndex].time).getDay() == new Date(displayedData[currentTimeIndex - 60].time).getDay()) {
                
                let average = 0;
                let counter = 0;

                let min = displayedData[currentTimeIndex].low;
                let max = displayedData[currentTimeIndex].high;
                let volumeMin = displayedData[currentTimeIndex].volume;
                let volumeMax = displayedData[currentTimeIndex].volume;

                for (let i = 0; i < 60; i++) {
                    if (displayedData[currentTimeIndex - i].low < min) {
                        min = displayedData[currentTimeIndex - i].low;
                    }
                    if (displayedData[currentTimeIndex - i].high > max) {
                        max = displayedData[currentTimeIndex - i].high;
                    }
                    if (displayedData[currentTimeIndex - i].volume < volumeMin) {
                        volumeMin = displayedData[currentTimeIndex - i].volume;
                    }
                    if (displayedData[currentTimeIndex - i].volume > volumeMax) {
                        volumeMax = displayedData[currentTimeIndex - i].volume;
                    }
                    average += Math.abs(displayedData[currentTimeIndex - i].close - displayedData[currentTimeIndex - i - 1].close);
                    counter++;
                }

                average = average / counter;
                let p_l = average * 5;

                let data = [];
                for (let i = 0; i < 60; i++) {
                    data.push((displayedData[currentTimeIndex - i].low - min) / (max - min));
                    data.push((displayedData[currentTimeIndex - i].high - min) / (max - min));
                    data.push((displayedData[currentTimeIndex - i].volume - volumeMin) / (volumeMax - volumeMin));
                    data.push((displayedData[currentTimeIndex - i].close - min) / (max - min));
                }
                
                let r = await fetch(`http://localhost:8000/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({stock_data: data})

            }
            return null;
        }

        // Transform API data [[ts, o, h, l, c, v],...] to chart format [{time, open,...},...]
        function transformApiData(apiData) {
            if (!Array.isArray(apiData)) {
                console.error("Invalid data format received from API:", apiData);
                return [];
            }
            return apiData.reduce((acc, item) => {
                // Validate item structure
                if (Array.isArray(item) && item.length >= 6) {
                    let timeValue = item[0];
                    // Convert timestamp if it's a number
                    if (typeof timeValue === 'number') {
                        timeValue = new Date(timeValue * 1000).toISOString(); // Convert to ISO string
                    }
                    if (item[1] == null) {
                        return acc;
                    }
                    acc.push({
                        time: timeValue,
                        open: item[1],
                        high: item[2],
                        low: item[3],
                        close: item[4],
                        volume: item[5]
                    });
                } else {
                    console.warn("Skipping invalid data point:", item);
                }
                return acc;
            }, []); // Initialize accumulator as an empty array
        }

                                updateDisplayedDataFromBackground();
                                chartManager.renderChart(displayedData);
                                return;
                            }
                        }
                        console.log(`Setting initial display index to the start of the last day: ${lastDayStartIndex}`);
                        // --- Find the start of the last day --- END

                        // Set the initial display up to the start of the last day
                        currentTimeIndex = lastDayStartIndex;
                        displayedData = fullHistoricalData.slice(0, currentTimeIndex + 1);

                        if (!differentInterval && selectedInterval == '1m') {
                            backgroundFullHistoricalData = fullHistoricalData;
                            backgroundDisplayedData = displayedData;
                            backgroundCurrentTimeIndex = currentTimeIndex;
                            backgroundSelectedInterval = selectedInterval;
                        }

                        updateAskBidPrices();
                    }
                } else {
                    if (differentInterval) {
                        alert('No data found for the selected interval. Please try a different interval.');
                    }
                    alert('Something went wrong when fetching the data. Please try again.');
                    return;
                }
                updateDisplayedDataFromBackground(autoScroll=false)
                chartManager.resetTools();
                chartManager.renderChart(displayedData);

            } catch (error) {
                console.error('Error fetching or processing chart data:', error);
                if (differentInterval) {
                    alert('No data found for the selected interval. Please try a different interval.');
                    return;
                }
                // Handle error in UI: show message, clear chart?
                fullHistoricalData = [];
                displayedData = [];
                currentTimeIndex = -1;
                backgroundSelectedInterval = null;
                initializeChartWithData(differentInterval);
                // Display error message to user?
            }

            // Reset pan and redraw with new offset/zoom
            // requestRedraw(true);
            // Optional: Remove loading indicator
        }


        function addIntervalToDate(date, interval) {
            // Extract the numeric value and unit from the interval string
            const value = parseInt(interval, 10);  // The numeric part
            const unit = interval.replace(/[0-9]/g, '');  // The unit (e.g., 'm' or 'hr')

            // Create a new Date object to avoid mutating the original one
            let newDate = new Date(date);

            // Add the interval based on the unit
            if (unit === 'm') {  // Minutes
                newDate.setMinutes(newDate.getMinutes() + value);
            } else if (unit === 'h') {  // Hours
                newDate.setHours(newDate.getHours() + value);
            } else if (unit === 'd') {  // Days (if you need this)
                newDate.setDate(newDate.getDate() + value);
            } else if (unit === 's') {  // Seconds (if needed)
                newDate.setSeconds(newDate.getSeconds() + value);
            } else {
                throw new Error(`Unsupported interval unit: ${unit}`);
            }

            return newDate;
        }

        function updateDisplayedDataFromBackground(autoScroll = true) {
            let currentTime = new Date(backgroundFullHistoricalData[backgroundCurrentTimeIndex].time).getTime();
            for (let i = fullHistoricalData.length - 2; i >= 0; i--) {

                const candleTime = new Date(fullHistoricalData[i].time).getTime();

                // Check if the candle time is less than or equal to the current time
                if (candleTime <= currentTime) {
                    currentTimeIndex = i;

                    lastDisplayedCandle = fullHistoricalData[currentTimeIndex]
                    lastDisplayedCandleStart = (new Date(fullHistoricalData[currentTimeIndex].time)).getTime()
                    lastDisplayedCandleEnd = addIntervalToDate(new Date(fullHistoricalData[currentTimeIndex].time), selectedInterval).getTime()
                    lastBackgroundCandleEnd = addIntervalToDate(new Date(backgroundFullHistoricalData[backgroundCurrentTimeIndex].time), '1m').getTime()

                    
                    let low = backgroundFullHistoricalData[backgroundCurrentTimeIndex]['low']
                    let high = backgroundFullHistoricalData[backgroundCurrentTimeIndex]['high']
                    let totalVolume = 0;

                    console.log('--------------------------------')
                    if (lastDisplayedCandleEnd > lastBackgroundCandleEnd) {
                        for (let j = backgroundCurrentTimeIndex; new Date(backgroundFullHistoricalData[j].time).getTime() >= lastDisplayedCandleStart; j--) {
                            if (backgroundFullHistoricalData[j]['low'] < low) {
                                low = backgroundFullHistoricalData[j]['low']
                            }
                            if (backgroundFullHistoricalData[j]['high'] > high) {
                                high = backgroundFullHistoricalData[j]['high']
                            }
                            totalVolume += backgroundFullHistoricalData[j]['volume']
                            console.log(backgroundFullHistoricalData[j]['time'])
                        }
                        
                        currentTimeIndex -= 1;
                    }

                    displayedData = fullHistoricalData.slice(0, currentTimeIndex + 1);
                    if (lastDisplayedCandleEnd > lastBackgroundCandleEnd) {
                        displayedData.push({
                            time: lastDisplayedCandle.time,
                            open: lastDisplayedCandle.open,
                            high: high,
                            low: low,
                            close: backgroundFullHistoricalData[backgroundCurrentTimeIndex].close,
                            volume: totalVolume
                        })
                    }

                    updateAskBidPrices();
                    if (autoScroll) {
                        // autoScrollToLastCandle();
                        // requestRedraw(true);
                    }
                    return i;
                }
            }
            currentTimeIndex = -1
            displayedData = []
            updateAskBidPrices();
            return -1;
        }

        function stepChart(steps = 1) {
            if (!backgroundFullHistoricalData || backgroundFullHistoricalData.length === 0) return; // No data to step through
            if (backgroundCurrentTimeIndex >= backgroundFullHistoricalData.length - 1) {
                console.log("End of historical data reached.");
                return; // Already at the end
            }
            backgroundCurrentTimeIndex = Math.min(backgroundCurrentTimeIndex + steps, backgroundFullHistoricalData.length - 1);

            updateCurrentPositions();
            updateBalanceFetch();
        
            // Render twice to avoid bug
            chartManager.renderChart(displayedData);
            chartManager.renderChart(displayedData);
        }

            // Sort closed positions by exit time, newest first (optional)
            const sortedClosedPositions = [...closedPositions].sort((a, b) => new Date(b.exitTime) - new Date(a.exitTime));

            sortedClosedPositions.forEach(pos => {
